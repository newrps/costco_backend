<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>코스트코 오늘의 할인</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="shortcut icon" href="/favicon.ico">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
  header { background: #005daa; color: white; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 1.2rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .nav-link { color: white; text-decoration: none; font-size: 0.85rem; opacity: 0.85; border: 1px solid rgba(255,255,255,0.4); padding: 6px 12px; border-radius: 6px; }
  .nav-link:hover { opacity: 1; background: rgba(255,255,255,0.15); }

  .summary-bar { background: white; padding: 14px 24px; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .summary-date { font-size: 0.9rem; color: #666; }
  .summary-count { font-size: 1rem; font-weight: 700; color: #005daa; }
  .summary-total { font-size: 0.85rem; color: #e65100; margin-left: auto; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; padding: 20px 24px; }

  .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: transform 0.15s, box-shadow 0.15s; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }

  .card-img { width: 100%; height: 180px; object-fit: contain; background: #f8f8f8; display: block; }
  .card-img-placeholder { width: 100%; height: 180px; background: #f0f4f8; display: flex; align-items: center; justify-content: center; font-size: 2rem; }

  .card-body { padding: 14px 16px; }
  .card-name { font-size: 0.95rem; font-weight: 600; line-height: 1.4; margin-bottom: 10px; min-height: 2.8rem; }

  .price-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .sale-price { font-size: 1.5rem; font-weight: 800; color: #c62828; }
  .original-price { font-size: 0.85rem; color: #aaa; text-decoration: line-through; }

  .discount-badge { display: inline-block; background: #fff0e0; color: #e65100; font-size: 0.85rem; font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }

  .card-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; border-top: 1px solid #f0f0f0; padding-top: 10px; }

  .days-badge { font-size: 0.78rem; padding: 3px 8px; border-radius: 20px; font-weight: 600; white-space: nowrap; }
  .days-urgent { background: #fce4ec; color: #c62828; }
  .days-soon   { background: #fff9c4; color: #f57f17; }
  .days-ok     { background: #e8f5e9; color: #2e7d32; }
  .days-none   { background: #f0f0f0; color: #888; }

  .badge { font-size: 0.72rem; padding: 3px 8px; border-radius: 20px; white-space: nowrap; position: relative; cursor: default; display: inline-block; }
  .badge-double    { background: #fff3e0; color: #e65100; }
  .badge-clearance { background: #fce4ec; color: #c62828; }
  .badge-mfr       { background: #f3e5f5; color: #7b1fa2; }
  .badge-instock   { background: #e8f5e9; color: #2e7d32; }
  .badge-lastchance{ background: #fff9c4; color: #f57f17; }
  .badge-category  { background: #e3f2fd; color: #1565c0; }

  .period { font-size: 0.78rem; color: #999; }

  .empty { text-align: center; padding: 80px 24px; color: #aaa; }
  .empty-icon { font-size: 3rem; margin-bottom: 12px; }
  .empty p { font-size: 0.95rem; }

  .loading { text-align: center; padding: 60px; color: #aaa; font-size: 0.95rem; }

  .sort-bar { padding: 10px 24px 0; display: flex; gap: 8px; align-items: center; }
  .sort-btn { padding: 6px 12px; border: 1px solid #ddd; border-radius: 6px; background: white; font-size: 0.82rem; cursor: pointer; color: #555; }
  .sort-btn.active { background: #005daa; color: white; border-color: #005daa; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 20px; border-radius: 8px; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>🏷️ 오늘의 할인</h1>
  <a class="nav-link" href="/admin">📋 전체 목록</a>
</header>

<div class="summary-bar">
  <span class="summary-date" id="todayDate"></span>
  <span class="summary-count" id="countText">불러오는 중...</span>
  <span class="summary-total" id="totalSaving"></span>
</div>

<div class="sort-bar">
  <span style="font-size:0.82rem;color:#888">정렬:</span>
  <button class="sort-btn active" onclick="setSort('discount')">할인액 순</button>
  <button class="sort-btn" onclick="setSort('price')">가격 순</button>
  <button class="sort-btn" onclick="setSort('days')">마감 임박순</button>
  <button id="favFilterBtn" onclick="toggleFavFilter()" style="margin-left:auto;padding:5px 12px;border:1px solid #ddd;border-radius:20px;background:white;font-size:0.80rem;cursor:pointer;color:#888;">❤️ 즐겨찾기</button>
</div>
<div style="padding:8px 24px;">
  <div style="position:relative;display:inline-flex;align-items:center;width:100%;max-width:400px;">
    <span style="position:absolute;left:10px;color:#aaa;font-size:0.9rem;">🔍</span>
    <input type="text" id="saleSearchBox" placeholder="상품명·카테고리 검색 (초성 가능)..." style="width:100%;padding:8px 34px 8px 32px;border:1px solid #ddd;border-radius:20px;font-size:0.88rem;outline:none;">
    <button id="saleClearSearch" onclick="clearSaleSearch()" style="position:absolute;right:10px;background:none;border:none;cursor:pointer;color:#aaa;display:none;">✕</button>
  </div>
</div>

<div id="content" class="loading">불러오는 중...</div>
<div class="toast" id="toast"></div>

<script>
let allItems = [];
let currentSort = 'discount';
let favFilterOn = false;
let saleQuery = '';

// 초성 검색
const CHOSUNG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function getInitial(c) { const n=c.charCodeAt(0); return n>=0xAC00&&n<=0xD7A3?CHOSUNG[Math.floor((n-0xAC00)/588)]:c.toLowerCase(); }
function toInitials(s) { return [...s].map(getInitial).join(''); }
function isAllChosung(s) { return s.length>0&&[...s].every(c=>CHOSUNG.includes(c)); }
function searchMatch(q,...fields) {
  const qn=q.replace(/\s+/g,'').toLowerCase(); if(!qn)return true;
  const cho=isAllChosung(qn);
  return fields.some(f=>{ if(f==null)return false; const t=String(f).replace(/\s+/g,'').toLowerCase(); return cho?toInitials(t).includes(qn):t.includes(qn); });
}
function highlight(text,q) {
  if(!q||isAllChosung(q.replace(/\s+/g,'')))return text;
  const esc=q.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return text.replace(new RegExp(esc,'gi'),m=>`<mark style="background:#fff176;padding:0 1px;border-radius:2px;">${m}</mark>`);
}
function clearSaleSearch() {
  document.getElementById('saleSearchBox').value='';
  document.getElementById('saleClearSearch').style.display='none';
  saleQuery=''; renderItems();
}

function getFavs() { return JSON.parse(localStorage.getItem('costco_favorites') || '[]'); }
function saveFavs(f) { localStorage.setItem('costco_favorites', JSON.stringify(f)); }

function toggleFavFilter() {
  favFilterOn = !favFilterOn;
  const btn = document.getElementById('favFilterBtn');
  btn.style.background = favFilterOn ? '#c62828' : 'white';
  btn.style.color = favFilterOn ? 'white' : '#888';
  btn.style.borderColor = favFilterOn ? '#c62828' : '#ddd';
  renderItems();
}

function toggleItemFav(itemId, btn) {
  let favs = getFavs();
  const id = String(itemId);
  if (favs.includes(id)) { favs = favs.filter(x => x !== id); btn.textContent = '🤍'; }
  else { favs.push(id); btn.textContent = '❤️'; }
  saveFavs(favs);
  if (favFilterOn) renderItems();
}

const TAG_INFO = {
  'Double Discount':       { cls: 'badge-double',    tip: '매니저 특별 할인' },
  'Clearance':             { cls: 'badge-clearance', tip: '재고 정리' },
  'Manufacturer Discount': { cls: 'badge-mfr',       tip: '생산업체 할인' },
};
const STOCK_INFO = {
  'In Stock':    { cls: 'badge-instock',    tip: '+ 재입고 불분명' },
  'Last Chance': { cls: 'badge-lastchance', tip: '* 마지막 물량' },
  '+':           { cls: 'badge-instock',    tip: '+ 재입고 불분명' },
  '*':           { cls: 'badge-lastchance', tip: '* 마지막 물량' },
};

function formatPrice(p) {
  return p != null ? Number(p).toLocaleString() + '원' : '';
}

function daysLeft(endStr) {
  if (!endStr) return null;
  const end = new Date(endStr);
  const today = new Date();
  today.setHours(0,0,0,0);
  end.setHours(0,0,0,0);
  return Math.round((end - today) / 86400000);
}

function daysBadge(endStr) {
  const d = daysLeft(endStr);
  if (d === null) return '<span class="days-badge days-none">기간 미정</span>';
  if (d < 0) return '';
  if (d === 0) return '<span class="days-badge days-urgent">오늘 마지막</span>';
  if (d === 1) return '<span class="days-badge days-urgent">내일 마감</span>';
  if (d <= 3) return `<span class="days-badge days-soon">${d}일 남음</span>`;
  return `<span class="days-badge days-ok">${d}일 남음</span>`;
}

function tagBadge(type) {
  const info = TAG_INFO[type];
  if (!info) return '';
  return `<span class="badge ${info.cls}">${type}</span>`;
}

function categoryBadge(cat) {
  if (!cat) return '';
  return `<span class="badge badge-category">${cat}</span>`;
}

function stockBadge(s) {
  const info = STOCK_INFO[s];
  if (!info) return '';
  return `<span class="badge ${info.cls}">${s}</span>`;
}

function setSort(type) {
  currentSort = type;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderItems();
}

function getSorted() {
  const favs = getFavs();
  let items = favFilterOn ? allItems.filter(i => favs.includes(String(i.item_id))) : [...allItems];
  if (saleQuery) items = items.filter(i => searchMatch(saleQuery, i.item_name, i.category, i.item_id));
  if (currentSort === 'discount') return items.sort((a,b) => (b.discount_amount||0) - (a.discount_amount||0));
  if (currentSort === 'price') return items.sort((a,b) => a.sale_price - b.sale_price);
  if (currentSort === 'days') {
    return items.sort((a,b) => {
      const da = daysLeft(a.discount_end) ?? 9999;
      const db = daysLeft(b.discount_end) ?? 9999;
      return da - db;
    });
  }
  return items;
}

function renderItems() {
  const content = document.getElementById('content');
  const sorted = getSorted();

  if (sorted.length === 0) {
    content.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><p>오늘 할인 중인 상품이 없습니다.</p></div>`;
    return;
  }

  if (sorted.length === 0 && favFilterOn) {
    content.className = '';
    content.innerHTML = `<div class="empty"><div style="font-size:2.5rem">🤍</div><p style="margin-top:8px;color:#aaa;">즐겨찾기한 상품이 없습니다.</p></div>`;
    return;
  }

  content.className = 'grid';
  const favs = getFavs();
  content.innerHTML = sorted.map(item => {
    const imgHtml = item.product_image_url
      ? `<img class="card-img" src="${item.product_image_url}" alt="${item.item_name}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=card-img-placeholder>🛒</div>'">`
      : `<div class="card-img-placeholder">🛒</div>`;

    const periodHtml = item.discount_start
      ? `<span class="period">${item.discount_start} ~ ${item.discount_end || ''}</span>`
      : '';

    const isFav = favs.includes(String(item.item_id));

    return `
    <div class="card" onclick="location.href='/item/${item.item_id}'" style="cursor:pointer;">
      ${imgHtml}
      <div class="card-body">
        <div class="card-name">${highlight(item.item_name, saleQuery)}</div>
        <div class="price-row">
          <span class="sale-price">${formatPrice(item.sale_price)}</span>
          ${item.original_price ? `<span class="original-price">${formatPrice(item.original_price)}</span>` : ''}
        </div>
        ${item.discount_amount ? `<div class="discount-badge">↓ ${formatPrice(item.discount_amount)} 할인</div>` : ''}
        <div class="card-meta">
          ${daysBadge(item.discount_end)}
          ${categoryBadge(item.category)}
          ${tagBadge(item.price_tag_type)}
          ${stockBadge(item.stock_status)}
          ${periodHtml}
          <button onclick="event.stopPropagation();toggleItemFav('${item.item_id}',this)" style="margin-left:auto;background:none;border:none;font-size:1.1rem;cursor:pointer;padding:0;line-height:1;">${isFav ? '❤️' : '🤍'}</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function load() {
  try {
    const res = await fetch('/sale-items');
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    allItems = data.items || [];

    const today = new Date().toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'short' });
    document.getElementById('todayDate').textContent = today;
    document.getElementById('countText').textContent = `${data.count}개 할인 중`;

    const total = allItems.reduce((s, i) => s + (i.discount_amount || 0), 0);
    if (total > 0) document.getElementById('totalSaving').textContent = `총 절약 가능 금액 ${total.toLocaleString()}원`;

    renderItems();
  } catch(e) {
    document.getElementById('content').innerHTML = `<div class="empty"><p>오류: ${e.message}</p></div>`;
  }
}

load();
setInterval(load, 60000);

(function() {
  let composing = false;
  const box = document.getElementById('saleSearchBox');
  box.addEventListener('compositionstart', () => composing = true);
  box.addEventListener('compositionend', () => { composing = false; saleQuery = box.value.trim(); document.getElementById('saleClearSearch').style.display = saleQuery ? 'block' : 'none'; renderItems(); });
  box.addEventListener('input', () => { if (!composing) { saleQuery = box.value.trim(); document.getElementById('saleClearSearch').style.display = saleQuery ? 'block' : 'none'; renderItems(); } });
  box.addEventListener('keydown', e => { if (e.key === 'Escape') clearSaleSearch(); });
})();
</script>
</body>
</html>
